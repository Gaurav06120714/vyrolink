[package]
name = "vl-crypto"
description = "VYRO LINK cryptography: pairing, pairwise wrap and tags, Olm sessions, Noise NN link handshake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vl-proto = { path = "../vl-proto" }
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
chacha20poly1305 = "=0.11.0"
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.1"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
