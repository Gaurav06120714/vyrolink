[package]
name = "vl-core"
description = "VYRO LINK node: orchestrates identity, pairing, messaging, routing, storage and encrypted link sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zeroize = "1.9"
vl-proto = { path = "../vl-proto" }
vl-crypto = { path = "../vl-crypto" }
vl-routing = { path = "../vl-routing" }
vl-store = { path = "../vl-store" }
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
