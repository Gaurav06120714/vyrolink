name: vl_host
description: "VYRO LINK native host: owns the Rust node, Bluetooth, Keychain/Keystore and camera; typed API for the Flutter UI."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  pigeon: 29.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.vyrolink.vl_host
        pluginClass: VlHostPlugin
      ios:
        pluginClass: VlHostPlugin
