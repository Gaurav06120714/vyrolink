<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Only the web chat's own scripts may run (ADR-040): scripts are limited
       to the chat's folder, which also keeps out anything a host injects
       elsewhere on the site. Connections: the mailbox, and fonts Flutter
       fetches for characters it lacks. Set by tools/build-web.sh. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src __VL_SCRIPTS__ 'wasm-unsafe-eval'; connect-src 'self' __VL_MAILBOX__ https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VYRO LINK web chat: end-to-end encrypted messages through the VYRO LINK mailbox.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VYRO LINK">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VYRO LINK web chat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- The Rust core (WebAssembly), the QR decoder and browser helpers; all
       served from this site, nothing from other companies. -->
  <script src="jsQR.js"></script>
  <script src="vlweb.js"></script>
  <script type="module" src="vlboot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
